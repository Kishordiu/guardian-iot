name: One-time repository cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maintenance-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Synchronize locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci
            echo "PACKAGE_RUNNER=npm" >> "$GITHUB_ENV"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
            echo "PACKAGE_RUNNER=bun" >> "$GITHUB_ENV"
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            echo "PACKAGE_RUNNER=pnpm" >> "$GITHUB_ENV"
          else
            echo "::error::No supported lockfile found."
            exit 1
          fi
      - name: Commit lockfile and formatting updates
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No file changes were necessary."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize lockfile and format source"
            git push
          fi
      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            "$PACKAGE_RUNNER" run build
          else
            echo "No build script is defined; skipping."
          fi
